name: Build ARLIMUSIK Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 35 packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ARLIMUSIK-INFLATOR-2.1-NEW-APP.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARLIMUSIK-INFLATOR-2.1-NEW-APP
          path: ARLIMUSIK-INFLATOR-2.1-NEW-APP.apk
          if-no-files-found: error

      - name: Publish standalone GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2.1-new-app --yes --cleanup-tag || true
          git tag -f v2.1-new-app
          git push -f origin v2.1-new-app
          gh release create v2.1-new-app ARLIMUSIK-INFLATOR-2.1-NEW-APP.apk \
            --title "ARLIMUSIK INFLATOR 2.1 — New App" \
            --notes "Отдельное Android-приложение с новым package ID и фирменной иконкой. Устанавливается рядом с предыдущей версией."
